services:
  - type: web
    name: aquashield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://aqua-shield-orcin.vercel.app,https://aqua-shield.vercel.app,http://localhost:5173
      - key: MAX_UPLOAD_MB
        value: "20"
